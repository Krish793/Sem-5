<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="sellerGlow" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a2656" />
      <stop offset="65%" stop-color="#18173d" />
      <stop offset="100%" stop-color="#111029" />
    </radialGradient>

    <linearGradient id="sgGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD36E" />
      <stop offset="50%" stop-color="#F2B544" />
      <stop offset="100%" stop-color="#B87B14" />
    </linearGradient>

    <linearGradient id="sgCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F6F5F1" />
      <stop offset="100%" stop-color="#CBC7B7" />
    </linearGradient>

    <linearGradient id="sgTerra" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C4110" />
      <stop offset="60%" stop-color="#C65D21" />
      <stop offset="100%" stop-color="#E87D3E" />
    </linearGradient>

    <filter id="sellerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="12" stdDeviation="12" flood-color="#070614" flood-opacity="0.6" />
    </filter>

    <pattern id="sellerGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(242, 181, 68, 0.08)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="450" rx="24" fill="url(#sellerGlow)" />
  <rect width="600" height="450" rx="24" fill="url(#sellerGrid)" />

  <!-- Artisan Workshop / Loom Graphic Ribbons -->
  <g filter="url(#sellerShadow)">
    <!-- Terracotta Diagonal Warp Ribbon -->
    <path d="M 70 380 C 140 370 200 320 250 250 C 300 180 370 120 450 100 C 510 85 540 110 540 140 C 540 180 470 230 400 290 C 320 360 210 400 130 400 Z"
          fill="url(#sgTerra)" opacity="0.9" />

    <!-- Cream Ribbon Interlocking Loop -->
    <path d="M 160 80 C 220 80 270 140 300 220 C 330 300 360 370 420 380 C 470 390 510 350 510 290 C 510 240 460 200 400 160 C 340 120 260 70 180 70 Z"
          fill="url(#sgCream)" opacity="0.92" />

    <!-- Ochre Gold Continuous Ribbon Ribbon (Front shuttle) -->
    <path d="M 90 220 C 120 140 190 90 270 100 C 350 110 390 190 410 270 C 430 340 390 390 320 390 C 250 390 200 330 180 260 C 160 200 110 180 80 220 Z"
          fill="none" stroke="url(#sgGold)" stroke-width="44" stroke-linecap="round" />

    <!-- Golden Highlight Accent -->
    <path d="M 230 105 C 280 105 340 135 375 190"
          fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Artisan Workshop Badges -->
  <g transform="translate(40, 40)">
    <rect width="180" height="38" rx="19" fill="rgba(38, 37, 73, 0.85)" stroke="rgba(242, 181, 68, 0.4)" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#227A54" />
    <text x="34" y="24" fill="#F6F5F1" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600">Verified Loom Master</text>
  </g>

  <g transform="translate(380, 370)">
    <rect width="180" height="42" rx="10" fill="rgba(23, 22, 56, 0.9)" stroke="rgba(242, 181, 68, 0.5)" stroke-width="1.2"/>
    <text x="18" y="26" fill="#F2B544" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700">92% Direct Payout</text>
  </g>
</svg>
