<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="orderGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2c2759" />
      <stop offset="70%" stop-color="#19183d" />
      <stop offset="100%" stop-color="#12112d" />
    </radialGradient>
    <linearGradient id="ordGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD36E" />
      <stop offset="60%" stop-color="#F2B544" />
      <stop offset="100%" stop-color="#B87B14" />
    </linearGradient>
    <linearGradient id="ordCream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F6F5F1" />
      <stop offset="100%" stop-color="#C7C4B5" />
    </linearGradient>
    <linearGradient id="ordTerra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F08A4B" />
      <stop offset="60%" stop-color="#C65D21" />
      <stop offset="100%" stop-color="#7A3008" />
    </linearGradient>
    <filter id="ordShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#080718" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#orderGlow)" />

  <g filter="url(#ordShadow)">
    <!-- Terracotta Loop -->
    <path d="M 250 110 C 330 110 390 170 390 250 C 390 330 330 390 250 390 C 210 390 170 370 145 340"
          fill="none" stroke="url(#ordTerra)" stroke-width="36" stroke-linecap="round" />

    <!-- Cream Ribbon Intertwining Knot -->
    <path d="M 170 150 C 210 110 290 110 330 150 C 370 190 370 270 320 320 C 270 370 190 370 150 320 C 110 270 110 190 170 150 Z"
          fill="none" stroke="url(#ordCream)" stroke-width="34" stroke-linecap="round" />

    <!-- Ochre Gold Foreground Loop with Weave Apex -->
    <path d="M 250 390 C 170 390 110 330 110 250 C 110 170 170 110 250 110 C 290 110 330 130 355 160"
          fill="none" stroke="url(#ordGold)" stroke-width="38" stroke-linecap="round" />

    <!-- Center Checkmark Emblem -->
    <circle cx="250" cy="250" r="42" fill="#171638" stroke="#F2B544" stroke-width="3" />
    <path d="M 234 250 L 246 262 L 268 238" fill="none" stroke="#F2B544" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
